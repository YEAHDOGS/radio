name: Deploy to Cloudflare Pages

# DOGS RADIO is a static Pages app for now: no API and no D1, so there is no staging environment.
# Pushes to master deploy straight to production. Add the D1 migration steps back when the API arrives.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PROJECT_NAME: radio

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build
        run: npm run build
      - name: Check deploy credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so this build was not deployed. Deploy by hand with: npm run deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Pages
        if: steps.credentials.outputs.ready == 'true'
        # Runs from the repo root so Wrangler ignores api/, which has no live API or database yet
        run: npx --yes wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
