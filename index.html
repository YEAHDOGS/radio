<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dogs Radio — tap in live</title>
<meta name="description" content="Tap listen and hear exactly what Jack Sparrow is playing right now — live. No sign-in, no account.">
<link rel="canonical" href="https://radio.dogs.red/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dogs Radio">
<meta property="og:title" content="Dogs Radio — tap in live">
<meta property="og:description" content="No sign-in. Hit listen and you're on Jack Sparrow's aux — live.">
<meta property="og:url" content="https://radio.dogs.red/">
<meta property="og:image" content="https://radio.dogs.red/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a0c">
<style>
:root{
  --bg:#0a0a0c; --ink:#f2ede3; --mut:#a8a094; --dim:#5c574c;
  --amber:#ffb03a; --amber-deep:#ff8a1e; --red:#ff453a;
  --line:#232227; --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  height:100svh; height:100dvh;
  display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
img{max-width:100%}

/* ambient background */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
.b1{left:-25vmax;top:-20vmax;background:radial-gradient(circle,rgba(255,176,58,.20),transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.b2{right:-25vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(255,69,58,.14),transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(1.08)}}
.artwash{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(90px) saturate(1.4);opacity:0;transition:opacity 1.2s var(--ease)}
body.live .artwash{opacity:.32}

/* header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 0;flex:0 0 auto;
}
.brand{font-weight:800;letter-spacing:.22em;font-size:13px}
.brand span{color:var(--amber)}
.livepill{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.18em;
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--dim);
  transition:color .4s,border-color .4s;
}
.livepill i{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .4s}
body.live .livepill{color:var(--red);border-color:rgba(255,69,58,.4)}
body.live .livepill i{background:var(--red);animation:pulse 1.6s ease-in-out infinite}
body.tuning .livepill{color:var(--amber);border-color:rgba(255,176,58,.4)}
body.tuning .livepill i{background:var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* stage */
main{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:0 24px;min-height:0;
}
#tunein{
  position:relative;width:168px;height:168px;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
#tunein .rings{position:absolute;inset:0;pointer-events:none}
#tunein .rings i{
  position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,176,58,.55);
  animation:ring 2.8s var(--ease) infinite;opacity:0;
}
#tunein .rings i:nth-child(2){animation-delay:.9s}
#tunein .rings i:nth-child(3){animation-delay:1.8s}
@keyframes ring{0%{transform:scale(.62);opacity:0}25%{opacity:.9}100%{transform:scale(1.18);opacity:0}}
#tunein .core{
  width:118px;height:118px;border-radius:50%;
  background:linear-gradient(145deg,var(--amber),var(--amber-deep));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 44px rgba(255,150,40,.35), inset 0 2px 6px rgba(255,255,255,.35);
  transition:transform .25s var(--ease);
  will-change:transform;
}
#tunein:active .core{transform:scale(.93)}
#tunein .playicon{width:44px;height:44px;fill:#1a1206;margin-left:6px}
#tunein .stopicon{display:none;width:36px;height:36px;fill:#1a1206}
body.tuned #tunein .playicon{display:none}
body.tuned #tunein .stopicon{display:block}
body.tuned #tunein .rings i{animation-play-state:paused;opacity:0}
.tune-label{font-size:15px;font-weight:800;letter-spacing:.3em;color:var(--ink)}
.tag{font-size:13px;color:var(--mut);text-align:center;max-width:300px;line-height:1.6;min-height:42px}
.listeners{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.listeners b{color:var(--amber);font-size:13px}
.spinner{width:118px;height:118px;display:none;align-items:center;justify-content:center}
body.tuning .spinner{display:flex}
body.tuning #tunein .core{display:none}
body.tuning #tunein .rings i{animation-duration:1.2s}
.spinner::after{
  content:"";width:52px;height:52px;border-radius:50%;
  border:3px solid rgba(255,176,58,.25);border-top-color:var(--amber);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* now playing card */
.nowcard{
  flex:0 0 auto;margin:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  width:calc(100% - 32px);max-width:430px;
  background:rgba(20,19,24,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;
  transform:translateY(140%);transition:transform .7s var(--ease);
}
body.live .nowcard{transform:translateY(0)}
.nowcard .art{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#1c1b20}
.nowcard .meta{min-width:0}
.nowcard .title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
.nowcard .artist{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;margin-top:2px}
.mq{display:inline-block;white-space:nowrap;will-change:transform}
.mq.scroll{animation:mq 9s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.eq{display:flex;align-items:flex-end;gap:3px;height:26px}
.eq i{width:4px;border-radius:2px;background:var(--amber);height:100%;transform:scaleY(.2);transform-origin:bottom}
body.live .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.prog{grid-column:1/-1;height:3px;border-radius:2px;background:#2a292e;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber-deep));border-radius:2px}

/* footer */
footer{
  flex:0 0 auto;display:flex;justify-content:center;
  padding:0 0 calc(env(safe-area-inset-bottom,0px) + 14px);
}
footer a{display:block;width:fit-content;opacity:.85}
footer img{height:26px;width:auto;display:block}

/* hidden youtube player */
#yt{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .blob,#tunein .rings i,.eq i,.mq.scroll,.spinner::after{animation:none !important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="artwash" id="artwash"></div></div>

<header>
  <div class="brand">DOGS<span>RADIO</span></div>
  <div class="livepill" id="livepill"><i></i><b id="livetext">OFF AIR</b></div>
</header>

<main>
  <button id="tunein" aria-label="Listen now">
    <span class="rings" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="core">
      <svg class="playicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="stopicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
    </span>
    <span class="spinner" aria-hidden="true"></span>
  </button>
  <div class="tune-label" id="tunelabel">LISTEN NOW</div>
  <p class="tag" id="tag">Tap in. You're on Jack Sparrow's aux — whatever he's playing, you're hearing it live.</p>
  <div class="listeners" id="listeners" hidden><b id="lcount">0</b> tuned in</div>
</main>

<section class="nowcard" id="nowcard" aria-live="polite">
  <img class="art" id="art" alt="">
  <div class="meta">
    <div class="title"><span class="mq" id="mqtitle"><span id="title">—</span></span></div>
    <div class="artist" id="artist">—</div>
  </div>
  <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="prog"><i id="progbar"></i></div>
</section>

<footer>
  <a href="https://wearedogs.net" aria-label="Made by DOGS"><img src="assets/made-by-dogs.png" alt="Made by DOGS"></a>
</footer>

<div id="yt" aria-hidden="true"></div>

<script>
"use strict";
/* Point this at your Gin server. */
const WS_URL = "wss://radio-api.dogs.red/ws";

const $ = id => document.getElementById(id);
const body = document.body;
const tunein = $("tunein"), tunelabel = $("tunelabel"), tag = $("tag"),
      livetext = $("livetext"), art = $("art"), artwash = $("artwash"),
      titleEl = $("title"), artistEl = $("artist"), mqtitle = $("mqtitle"),
      progbar = $("progbar"), listenersEl = $("listeners"), lcount = $("lcount");

let tuned = false, ws = null, retryMs = 1000, retryTimer = null;
let player = null, playerReady = false, currentVideo = null;
let state = null, progTimer = null;

function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ---------- YouTube IFrame Player API: audio in the background, no sign-in ---------- */
function ensurePlayer(){
  return new Promise(resolve => {
    if (playerReady) return resolve();
    if (window.YT && window.YT.Player){ createPlayer(resolve); return; }
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    window.onYouTubeIframeAPIReady = () => createPlayer(resolve);
    document.head.appendChild(s);
  });
}
function createPlayer(done){
  player = new YT.Player("yt", {
    height: "2", width: "2",
    playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0 },
    events: { onReady: () => { playerReady = true; done && done(); } }
  });
}

/* ---------- UI states ---------- */
function setTag(t){ tag.textContent = t; }
function showIdle(){
  body.classList.remove("tuning","tuned","live");
  tunelabel.textContent = "LISTEN NOW";
  livetext.textContent = "OFF AIR";
}
function showTuning(){
  body.classList.add("tuning"); body.classList.remove("tuned","live");
  tunelabel.textContent = "TUNING IN";
  livetext.textContent = "CONNECTING";
  setTag("Warming up the transmitter…");
}
function showLive(msg){
  body.classList.add("tuned","live"); body.classList.remove("tuning");
  tunelabel.textContent = "TAP TO LEAVE";
  livetext.textContent = (msg && msg.src === "autodj") ? "AUTO DJ" : "LIVE";
}
function showOffAir(){
  body.classList.add("tuned"); body.classList.remove("tuning","live");
  livetext.textContent = "STANDBY";
  setTag("He's not on the decks right now. Stay tuned — the second he hits play, you're in.");
  stopPlayback();
}
function marquee(){
  const inner = mqtitle.querySelector("span") || mqtitle;
  mqtitle.classList.remove("scroll");
  requestAnimationFrame(() => {
    if (mqtitle.scrollWidth > mqtitle.clientWidth + 4){
      const t = titleEl.textContent;
      titleEl.innerHTML = "";
      const a = document.createElement("span"); a.textContent = t + "\u2003\u2003";
      const b = document.createElement("span"); b.textContent = t + "\u2003\u2003";
      titleEl.append(a, b);
      mqtitle.classList.add("scroll");
    }
  });
}

/* ---------- playback ---------- */
function applyNow(msg){
  state = msg;
  if (!msg || !msg.playing){ showOffAir(); return; }
  const tr = msg.track || {};
  /* reset marquee dupes */
  titleEl.innerHTML = ""; 
  const ts = document.createElement("span"); ts.textContent = tr.title || "Unknown track";
  titleEl.appendChild(ts);
  artistEl.textContent = (tr.artists || []).join(", ") || "Unknown artist";
  if (tr.art){ art.src = tr.art; artwash.style.backgroundImage = 'url("' + tr.art + '")'; }
  marquee();
  showLive(msg);
  setTag("You're hearing exactly what he's hearing.");
  if (playerReady){
    if (msg.yt && msg.yt !== currentVideo){
      currentVideo = msg.yt;
      const start = Math.max(0, Math.floor((msg.progress_ms || 0) / 1000));
      player.loadVideoById({ videoId: msg.yt, startSeconds: start });
    } else if (player.getPlayerState() !== YT.PlayerState.PLAYING){
      player.playVideo();
    }
  }
  startProgress();
}
function stopPlayback(){
  currentVideo = null;
  try{ if (player && playerReady) player.stopVideo(); }catch(e){}
  stopProgress();
}
function startProgress(){
  stopProgress();
  if (!state || !state.track || !state.track.duration_ms) return;
  const t0 = Date.now(), p0 = state.progress_ms || 0, dur = state.track.duration_ms;
  progTimer = setInterval(() => {
    const pct = Math.min(100, ((p0 + (Date.now() - t0)) / dur) * 100);
    progbar.style.width = pct + "%";
    if (pct >= 100) stopProgress();
  }, 500);
}
function stopProgress(){ if (progTimer){ clearInterval(progTimer); progTimer = null; } progbar.style.width = "0"; }

/* ---------- websocket to the Gin server ---------- */
function connect(){
  showTuning();
  let sock;
  try{ sock = new WebSocket(WS_URL); }catch(e){ fail("Couldn't open the station socket."); return; }
  ws = sock;
  const timeout = setTimeout(() => { try{ sock.close(); }catch(e){} }, 8000);
  sock.onopen = () => { clearTimeout(timeout); retryMs = 1000; };
  sock.onmessage = ev => {
    let msg; try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if (msg.t === "now") applyNow(msg);
    else if (msg.t === "count"){ lcount.textContent = msg.n; listenersEl.hidden = false; }
    else if (msg.t === "offair") showOffAir();
  };
  const dead = () => {
    clearTimeout(timeout);
    if (!tuned){ fail("Couldn't reach the station — the Gin server isn't up yet."); return; }
    livetext.textContent = "RECONNECTING";
    setTag("Signal dropped. Hunting for it…");
    stopPlayback();
    body.classList.remove("live");
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (tuned) connect(); }, retryMs);
    retryMs = Math.min(retryMs * 2, 15000);
  };
  sock.onclose = dead; sock.onerror = dead;
}
function fail(msg){
  tuned = false; ws = null;
  showIdle();
  setTag(msg);
}
function leave(){
  tuned = false;
  clearTimeout(retryTimer);
  try{ ws && ws.close(); }catch(e){}
  ws = null; stopPlayback();
  listenersEl.hidden = true;
  showIdle();
  setTag("Tap in. You're on Jack Sparrow's aux — whatever he's playing, you're hearing it live.");
}

tunein.addEventListener("click", async () => {
  vibrate(12);
  if (tuned){ leave(); return; }
  tuned = true;
  await ensurePlayer();
  connect();
});
</script>
</body>
</html>
